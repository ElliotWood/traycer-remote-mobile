# Pre-commit hooks. https://pre-commit.com
# Install once:  pipx install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg
# Run on demand: pre-commit run --all-files
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.gen\.(ts|tsx)$
      - id: end-of-file-fixer
        exclude: \.gen\.(ts|tsx)$
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
        # tsconfig is JSONC by spec — TypeScript itself parses comments and
        # trailing commas there, and several of ours carry load-bearing
        # comments (e.g. why "dom" must not join lib). A strict-JSON check
        # on a JSONC file reports the format, not a defect.
        exclude: (^|/)tsconfig(\..+)?\.json$
      - id: check-merge-conflict

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.20
    hooks:
      - id: shellcheck

  - repo: meta
    hooks:
      - id: check-hooks-apply

  # DCO sign-off enforcement, mirroring .github/workflows/dco.yml. Runs at the
  # commit-msg stage because the `Signed-off-by:` trailer is part of the message.
  - repo: local
    hooks:
      - id: dco-signoff
        name: DCO sign-off (git commit -s)
        entry: scripts/check_dco_signoff.sh
        language: script
        stages: [commit-msg]

  # OSS hygiene — no machine-identifying strings in a public repo.
  # Repo-wide by design: every agent previously ran this scoped to its own
  # package and reported clean, while real hits accumulated elsewhere. A rule
  # each contributor must remember to run tree-wide is not a gate.
  - repo: local
    hooks:
      - id: oss-hygiene
        name: oss hygiene (no machine/user/tailnet identifiers)
        entry: scripts/oss-hygiene.sh
        language: script
        pass_filenames: false
        always_run: true

  # Project checks — build / compile / lint / format (nx affected for speed).
  # Tests run in their own workflow (.github/workflows/test.yml).
  - repo: local
    hooks:
      - id: workspace-checks
        name: build · compile · lint · format (nx affected)
        entry: scripts/pre_commit_workspace_checks.sh
        language: script
        pass_filenames: false
        files: >-
          (?x)^(
            bun\.lock|
            bunfig\.toml|
            nx\.json|
            package\.json|
            \.pre-commit-config\.yaml|
            tsconfig.*\.json|
            eslint/.*|
            protocol/.*|
            clients/.*|
            scripts/.*
          )$
