name: Tests

# Tests run as their own workflow so they start in parallel with the static
# checks (build/typecheck/lint/format). Each nx test project runs as its own
# matrix job, so total wall-clock is the slowest single project rather than the
# sum of all three. No secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    # The GUI suite deliberately runs isolated two-worker forks: disabling
    # isolation makes tests leak state. The organization caps every job at ten
    # minutes, so run its deterministic Vitest shards as four parallel matrix
    # jobs.
    #
    # The larger runner is named by a repository/organization variable, not by a
    # literal label, because a private label is not portable. A repository with
    # no runner answering `ubuntu-latest-8-cores` does not fail these jobs — it
    # never schedules them: all four sat in the queue for GitHub's 24-hour
    # scheduling limit and were killed "while awaiting a runner", while every
    # other job in the same run, all on `ubuntu-latest`, finished in under
    # ninety seconds. That reads as a red suite and is not one; it is 1,055 test
    # files that never ran. Set GUI_APP_RUNNER wherever the larger runner
    # exists; anywhere else the fallback keeps the shards scheduling. Guarded by
    # `protocol/__tests__/ci-runner-labels.test.ts`.
    runs-on: ${{ matrix.project == 'traycer-clients-gui-app' && (vars.GUI_APP_RUNNER || 'ubuntu-latest') || 'ubuntu-latest' }}
    strategy:
      # Run every project even if one fails, so a single red project doesn't
      # mask the others.
      fail-fast: false
      matrix:
        # The nx projects that own a `test` target. Names are exact nx project
        # names (gui-app's differs from its package scope). Keep in sync with
        # `nx show projects --with-target test`.
        include:
          - project: "@traycer/protocol"
            name: "test (@traycer/protocol)"
            test_args: ""
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app)"
            test_args: "-- --shard=1/4"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 2)"
            test_args: "-- --shard=2/4"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 3)"
            test_args: "-- --shard=3/4"
          - project: traycer-clients-gui-app
            name: "test (traycer-clients-gui-app shard 4)"
            test_args: "-- --shard=4/4"
          - project: "@traycer-clients/desktop"
            name: "test (@traycer-clients/desktop)"
            test_args: ""
          - project: "@traycer-clients/shared"
            name: "test (@traycer-clients/shared)"
            test_args: ""
          - project: "@traycer-clients/traycer-cli"
            name: "test (@traycer-clients/traycer-cli)"
            test_args: ""
          # Added after an audit found these projects own a `test` script
          # and were absent from this list — test files that had never run in
          # CI. The first run caught a real failure: a test reading an
          # absolute path outside the repository, which could not have passed
          # on any machine but its author's.
          #
          # This list is hand-maintained and had silently drifted from the
          # command in the comment above. If it drifts again, prefer deriving
          # it over re-syncing by hand.
          #
          # Merge note: both this branch and `traycer-remote-bridge` appended
          # here independently, so the union is the correct resolution — not
          # either side alone. `teams-bot` was missing from BOTH and is added
          # here for the same reason the others were: it owns a `test` script
          # (76 tests) and had never run in CI.
          #
          # traycer-clients-mobile and @traycer-clients/teams-tab entries
          # removed 2026-08-05 when both packages were archived
          # (archive/clients-mobile, archive/clients-teams-tab) and deleted
          # from main.
          #
          # It drifted a third time: `@traycer-clients/remote` arrived on main
          # owning a `test` script with no job here, so its tests had never run
          # in CI either. Re-syncing by hand again would only queue up a fourth
          # time, so the derivation the comment above asks for now runs as a
          # test — `protocol/__tests__/ci-test-matrix-coverage.test.ts` fails
          # when this list and the set of test-owning nx projects disagree in
          # either direction. Keep adding entries by hand (the jobs carry
          # per-project config a generated matrix could not supply); that gate
          # is what makes forgetting one loud instead of silent.
          - project: "@traycer-clients/mobile-push-service"
            name: "test (@traycer-clients/mobile-push-service)"
            test_args: ""
          - project: "@traycer-clients/remote-bridge"
            name: "test (@traycer-clients/remote-bridge)"
            test_args: ""
          - project: "@traycer-clients/teams-bot"
            name: "test (@traycer-clients/teams-bot)"
            test_args: ""
          - project: "@traycer-clients/remote"
            name: "test (@traycer-clients/remote)"
            test_args: ""
          # The browser/Teams shell. It arrived on main carrying 22 test files
          # that had run in no CI on any branch — the package lived only on the
          # `/next/` stack, whose own workflow both omitted it AND triggers on
          # nothing but `main` and pull requests, so it had never even had the
          # chance. The gate below caught its absence here on the first commit
          # that added it, which is the whole reason that gate exists.
          - project: "@traycer-clients/mobile"
            name: "test (@traycer-clients/mobile)"
            test_args: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Cache bun global install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # Restore the Nx computation cache so a project whose inputs (own files +
      # dependency source, see `test` inputs in nx.json) are unchanged replays a
      # cached result in seconds instead of re-running the full suite. Keyed per
      # matrix project so the legs don't clobber each other; the SHA suffix makes
      # every run save the freshest cache while restore-keys pull the latest
      # same-project cache (populated by pushes to main, readable by PRs).
      - name: Cache Nx computation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ matrix.project }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ matrix.project }}-
      - run: bun install --frozen-lockfile
      # The host-v1.1.5 oracle in `provider-native-schemas.test.ts` regenerates
      # the checked-in fixture straight from the tag and deep-equals the two.
      # `actions/checkout` fetches no tags, so without this it skips itself and
      # the check never runs anywhere: `guarded-files-tripwire` only catches a
      # hand-edit to the fixture, NOT a generator that has drifted away from it.
      #
      # A shallow single-tag fetch is enough — the tag's commit arrives with a
      # complete tree, so the blobs the oracle reads are all present (~2s, ~6MB;
      # a full `fetch-depth: 0` clone would buy nothing here).
      #
      # `origin` carries the tag only in the repository that publishes it. A
      # fork inherits no tags, so there this step exited 128 — "couldn't find
      # remote ref refs/tags/host-v1.1.5" — and took the whole
      # `@traycer/protocol` job down before its Test step ran: 126 files that
      # never executed, reported as one red job. Falling back to the public
      # upstream supplies the oracle without weakening it. If neither remote
      # has the tag this still fails, which is the point: the paragraph above
      # exists because an oracle that quietly skips itself is the failure mode.
      - name: Fetch the host-v1.1.5 tag the schema oracle regenerates from
        if: matrix.project == '@traycer/protocol'
        run: |
          git fetch --depth=1 origin tag host-v1.1.5 \
            || git fetch --depth=1 https://github.com/traycerai/traycer.git tag host-v1.1.5
      # `--outputStyle=stream` instead of `--tui=false`: Nx buffers the child's
      # output and replays it AFTER the failure banner, capped, so a red gui-app
      # shard has three times ended mid-write with no test named and twice cut
      # off before the assertion text (docs/autobuild/ci-tests-flake.md).
      # Streaming writes it straight to the step log in causal order. The two
      # flags are mutually exclusive in Nx (exit 1 before any test runs), so
      # this replaces rather than adds. Same change as upstream #951 / #1552.
      - name: Test
        run: bunx nx run-many --target=test --projects="${{ matrix.project }}" --outputStyle=stream ${{ matrix.test_args }}

  # macOS job: the desktop workspace's packaging/signing-adjacent assertions
  # (prepack unit suite + the real electron-builder pack in test:packaging)
  # are `skipIf(platform !== "darwin")`-gated and silently skip on the ubuntu
  # matrix above. Without this job the release-critical helper/plist
  # injection (BundleProgram relativity, NumberOfFiles=8192, relocation,
  # real-pack wiring) has no CI coverage at all. The full desktop unit suite
  # runs here too so darwin-only regressions surface; every launchctl-adjacent
  # test in it forces `process.platform` OFF darwin internally, so nothing in
  # this job can touch the runner's real launchd/BTM state.
  test-macos-packaging:
    name: test (desktop darwin + packaging)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Cache bun global install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # Same Nx computation cache as the `test` job. The runner.os in the key is
      # load-bearing here: the desktop suite runs darwin-gated blocks that are
      # skipped on Linux, so a Linux-computed result must never replay on macOS
      # (and vice versa) — scoping the cache by OS keeps the two separate.
      - name: Cache Nx computation cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-@traycer-clients/desktop-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-@traycer-clients/desktop-
      - run: bun install --frozen-lockfile
      - name: Desktop unit tests (darwin-gated blocks included)
        run: bunx nx run-many --target=test --projects="@traycer-clients/desktop" --outputStyle=stream
      - name: Real electron-builder packaging test
        run: bun run test:packaging
        working-directory: clients/desktop
